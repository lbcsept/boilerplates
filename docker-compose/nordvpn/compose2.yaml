networks:
  vpn_network:
# source : https://www.reddit.com/r/docker/comments/rew3ru/nordvpn_portainer_container/
services:

  vpn:
    image: ghcr.io/bubuntux/nordvpn
    container_name: NordVPN
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - USER=${NORDVPN_USER}
      - PASS=${NORDVPN_PASS}
      - CONNECT=France
      - TECHNOLOGY=NordLynx
      - NETWORK=192.168.1.0/24
    ports:
      # - 8080:8080 #qbittorent
      # - 9117:9117 #jackett
      - 8989:8989 #sonarr
      # - 7878:7878 #radarr
      # - 8686:8686 #lidarr
      # - 9696:9696 #prowlarr
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    networks:
      - vpn_network

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
    volumes:
      - /../config:/config
      - /../Media/TV:/tv
      - /../torrents:/downloads
    restart: unless-stopped
    network_mode: service:vpn
    depends_on:
      - vpn